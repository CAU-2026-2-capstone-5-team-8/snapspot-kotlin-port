name: Android CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Also run the on-device tests on an emulator (slow)"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Accepts the SDK licences so Gradle can download compileSdk 37 and the build tools. The runner already has
      # the SDK, and the action's default "tools" package cannot be found (sdkmanager fails), so install nothing.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      # There is no local.properties on CI: the API keys stay empty, which is fine for building and for the
      # unit tests. Live API tests only run with -PliveApi=true, which CI never passes.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew lintDebug --console=plain

      - name: Build debug and release
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  # On-device tests need an emulator, which is slow and flaky on shared runners, so they only run on request.
  # The map SDK ships ARM libraries only; the map itself is switched off on an x86 emulator, the rest still runs.
  instrumented:
    if: github.event_name == 'workflow_dispatch' && inputs.instrumented
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Keep the reports when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
